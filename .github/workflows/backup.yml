name: Sauvegarde PostgreSQL

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_BACKUP_RO: ${{ secrets.DATABASE_URL_BACKUP_RO }}
      BLOB_PRIVATE_READ_WRITE_TOKEN: ${{ secrets.BLOB_PRIVATE_READ_WRITE_TOKEN }}
      AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vérifier les secrets
        run: |
          for name in DATABASE_URL_BACKUP_RO BLOB_PRIVATE_READ_WRITE_TOKEN AGE_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name manquant. Voir ENV.md."
              exit 1
            fi
          done

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client age
          psql --version
          age --version

      - name: Nommer la sauvegarde
        id: name
        run: echo "stamp=$(date -u +%Y-%m-%dT%H%M)" >> "$GITHUB_OUTPUT"

      - name: Compter les lignes
        run: |
          psql "$DATABASE_URL_BACKUP_RO" -At -v ON_ERROR_STOP=1 -c "
            SELECT json_build_object(
              'articles', (SELECT count(*) FROM articles),
              'suggestions', (SELECT count(*) FROM suggestions),
              'votes', (SELECT count(*) FROM suggestion_votes),
              'reports', (SELECT count(*) FROM reports),
              'audit', (SELECT count(*) FROM audit_log)
            );" > counts.json
          cat counts.json

      - name: Dump
        run: |
          pg_dump "$DATABASE_URL_BACKUP_RO" \
            --schema=public \
            --format=custom --no-owner --no-privileges \
            --file=union.dump
          test -s union.dump

      - name: Chiffrer
        run: |
          age --recipient "$AGE_PUBLIC_KEY" --output union.dump.age union.dump
          test -s union.dump.age
          sha256sum union.dump.age | cut -d' ' -f1 > sha256.txt
          stat -c%s union.dump.age > size.txt

      - name: Envoyer au Blob privé
        run: |
          stamp="${{ steps.name.outputs.stamp }}"
          node scripts/blob-store.mjs put union.dump.age "backups/union-$stamp.dump.age"
          node scripts/blob-store.mjs put counts.json "backups/union-$stamp.counts.json"

      - name: Journaliser dans backup_log
        run: |
          stamp="${{ steps.name.outputs.stamp }}"
          sha="$(cat sha256.txt)"
          size="$(cat size.txt)"
          counts="$(cat counts.json)"
          psql "$DATABASE_URL_BACKUP_RO" -v ON_ERROR_STOP=1 -c "
            INSERT INTO backup_log (id, created_at, size_bytes, sha256, row_counts, destination)
            VALUES (
              'backup-$stamp',
              now()::text,
              $size,
              '$sha',
              \$\$$counts\$\$,
              'backups/union-$stamp.dump.age'
            );"

      - name: Rétention (8 quotidiennes, 3 mensuelles)
        run: |
          node scripts/blob-store.mjs list backups/ | grep '^backups/union-.*\.dump\.age$' | sort > all.txt
          monthly=$(grep -c '^backups/union-....-..-01T' all.txt || true)
          if [ "$monthly" -gt 3 ]; then
            grep '^backups/union-....-..-01T' all.txt | head -n -3 | while read -r path; do
              node scripts/blob-store.mjs delete "$path"
            done
          fi
          grep -v '^backups/union-....-..-01T' all.txt | head -n -8 | while read -r path; do
            node scripts/blob-store.mjs delete "$path"
          done

      - name: Résumé
        run: |
          echo "Sauvegarde ${{ steps.name.outputs.stamp }} : $(cat size.txt) octets, SHA-256 $(cat sha256.txt)." >> "$GITHUB_STEP_SUMMARY"
          echo "Test de restauration : workflow mensuel « Test de restauration »." >> "$GITHUB_STEP_SUMMARY"
