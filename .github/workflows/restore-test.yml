name: Test de restauration

on:
  schedule:
    - cron: '30 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BLOB_PRIVATE_READ_WRITE_TOKEN: ${{ secrets.BLOB_PRIVATE_READ_WRITE_TOKEN }}
      AGE_TEST_PRIVATE_KEY: ${{ secrets.AGE_TEST_PRIVATE_KEY }}
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: restore
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vérifier les secrets
        run: |
          for name in BLOB_PRIVATE_READ_WRITE_TOKEN AGE_TEST_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name manquant. Voir ENV.md."
              exit 1
            fi
          done

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client age jq
          psql --version

      - name: Télécharger la dernière sauvegarde
        run: |
          key=$(node scripts/blob-store.mjs list backups/ \
            | grep '\.dump\.age$' | sort | tail -1)
          if [ -z "$key" ]; then
            echo "::error::Aucune sauvegarde trouvée dans backups/."
            exit 1
          fi
          echo "Dernière sauvegarde : $key"
          node scripts/blob-store.mjs get "$key" latest.dump.age
          counts_key="${key%.dump.age}.counts.json"
          node scripts/blob-store.mjs get "$counts_key" counts.json
          echo "counts.json : $(cat counts.json)"

      - name: Déchiffrer et restaurer
        run: |
          printf '%s\n' "$AGE_TEST_PRIVATE_KEY" > test-key.txt
          chmod 600 test-key.txt
          age --decrypt --identity test-key.txt --output latest.dump latest.dump.age
          pg_restore --no-owner --no-privileges latest.dump
          rm -f test-key.txt latest.dump

      - name: Comparer les nombres de lignes
        run: |
          psql -At -v ON_ERROR_STOP=1 -c "
            SELECT json_build_object(
              'articles', (SELECT count(*) FROM articles),
              'suggestions', (SELECT count(*) FROM suggestions),
              'votes', (SELECT count(*) FROM suggestion_votes),
              'reports', (SELECT count(*) FROM reports),
              'audit', (SELECT count(*) FROM audit_log)
            );" > restored.json
          echo "attendu : $(cat counts.json)"
          echo "restauré : $(cat restored.json)"
          if ! jq -e --slurp '.[0] == .[1]' counts.json restored.json > /dev/null; then
            echo "::error::La restauration ne correspond pas aux comptes sauvegardés."
            exit 1
          fi

      - name: Résumé
        run: echo "Restauration vérifiée le $(date -u +%Y-%m-%d)." >> "$GITHUB_STEP_SUMMARY"
